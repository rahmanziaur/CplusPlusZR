public:

code:String.raw`#include <bits/stdc++.h>
using namespace std;
const long long MOD = 1000000007;
struct ModInt {
  long long v;
  ModInt(long long x = 0) : v(((x % MOD) + MOD) % MOD) {}
  ModInt operator+(ModInt o) const { return v + o.v; }
  ModInt operator*(ModInt o) const { return v * o.v; }
  ModInt pow(long long e) const { ModInt r(1), b = *this; while (e) { if (e & 1) r = r * b; b = b * b; e >>= 1; } return r; }
  ModInt inv() const { return pow(MOD - 2); }
  ModInt operator/(ModInt o) const { return *this * o.inv(); }
};
ostream& operator<<(ostream& o, ModInt m) { return o << m.v; }
int main() {
  ModInt a(10), b(3);
  cout << a + b << " " << a * b << " " << a / b << " " << (a / b) * b << "\n";  // 13 30 ... 10
}`,

th:"new/delete manage heap memory; prefer smart pointers. A move constructor (X&&) steals resources instead of copying: std::move. Namespaces prevent name clashes (algo::power). Templates write code once for many types. Toy RSA: n=pq, φ=(p-1)(q-1), pick e coprime to φ, d = e^-1 mod φ; c = m^e mod n, m = c^d mod n.",
sn:"template<class T> T power(T b, long long e, T m);\nBuf b = std::move(a);   // a.p becomes nullptr",
code:String.raw`#include <bits/stdc++.h>
using namespace std;
namespace algo {
  template<class T> T power(T b, long long e, T m) {
    T r = 1; b %= m;
    while (e) { if (e & 1) r = r * b % m; b = b * b % m; e >>= 1; }
    return r;
  }
}
struct Buf {
  int* p; int n;
  Buf(int n) : p(new int[n]{}), n(n) {}
  Buf(Buf&& o) noexcept : p(o.p), n(o.n) { o.p = nullptr; }
  ~Buf() { delete[] p; }
};
int main() {
  // RSA: p=61 q=53 n=3233 e=17 d=2753
  long long c = algo::power<long long>(65, 17, 3233);
  long long m = algo::power<long long>(c, 2753, 3233);
  cout << c << " " << m << "\n";              // 2790 65
  Buf a(5); Buf b = std::move(a);
  cout << (a.p == nullptr) << "\n";           // 1
}`,

code:String.raw`#include <bits/stdc++.h>
using namespace std;
#define SQ(x) ((x) * (x))
volatile sig_atomic_t stopFlag = 0;
void handler(int) { stopFlag = 1; }
bool isPrime(int n) { if (n < 2) return false; for (int i = 2; i * i <= n; i++) if (n % i == 0) return false; return true; }
void cnt(int l, int r, int& out) { for (int i = l; i < r; i++) if (isPrime(i)) out++; }
int main() {
  signal(SIGINT, handler); raise(SIGINT);
  cout << "stop requested: " << stopFlag << ", SQ(3+1)=" << SQ(3 + 1) << "\n";
  int a = 0, b = 0;
  thread t1(cnt, 2, 50000, ref(a)), t2(cnt, 50000, 100000, ref(b));
  t1.join(); t2.join();
  cout << "primes below 100000: " << a + b << "\n";   // 9592
}`,

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
let h=`<section class="sec" id="home"><div class="eyebrow">Fall 2026 · Dept of ICT</div>
<h2>C++ <span>Lab</span></h2>
<p class="lead">Instructor: <b>Ziaur Rahman</b>. Object-oriented C++ for contest programmers. Over 12 labs you build one project — <b>ContestHub</b>, a small online judge — while practising data structures, number theory, modular arithmetic, DP, greedy, graphs and cryptography.</p>
<div class="pills"><span class="pill a">12 Labs</span><span class="pill">Saturdays</span><span class="pill">C++17</span><span class="pill">ICPC / Codeforces style</span></div>
<div class="story">Prof. Zia is opening an online judge for the ICT department’s programming club. Each Saturday, one more piece of ContestHub is built — Contestants, Problems, Scoring, Ciphers and finally a parallel judge.</div>
<div class="card"><div class="lbl">Weekly schedule</div><div class="tw"><table><tr><th>Lab</th><th>Date (Sat)</th><th>Topics</th></tr>`;
SCHED.forEach((s,i)=>h+=`<tr class="go" onclick="show('l${i+1}')"><td>${i+1}</td><td>${s[0]}</td><td>${s[1]}</td></tr>`);
h+=`</table></div><p style="margin-top:10px">After the labs: Web/Socket programming (Jan 2), Project Build Lab (Jan 9), Demo Day (Jan 16, 2027).</p></div>
<div class="card"><div class="lbl">How to use</div><p>Each lab: <b>theory → snippet → complete code → assignment</b>. Edit the code in the editor, then press <b>Run ▶</b> — it opens Compiler Explorer (GCC 13) with your code and an execution pane. Put input in the stdin box.</p></div></section>`;
LABS.forEach((l,i)=>{const k=i+1;
h+=`<section class="sec" id="l${k}"><div class="lab">Lab ${String(k).padStart(2,'0')} · ${SCHED[i][0]}</div><h2>${esc(l.n)}</h2>
<p class="lead">${esc(SCHED[i][1])}</p><div class="story">${esc(l.st)}</div>
<div class="card"><div class="lbl">Theory</div><p>${esc(l.th)}</p></div>
<div class="card"><div class="lbl">Snippet</div><pre>${esc(l.sn)}</pre></div>
<div class="card"><div class="lbl">Complete code · editable</div>
<textarea id="c${k}" rows="${Math.min(24,l.code.split('\n').length+1)}" spellcheck="false" onkeydown="tab(event)">${esc(l.code)}</textarea>
<textarea class="in" id="i${k}" placeholder="stdin (optional)" spellcheck="false"></textarea>
<div class="bar"><button class="run" onclick="run(${k})">Run ▶</button><button onclick="reset(${k})">Reset</button><button onclick="cp(${k})">Copy</button><span class="hint">Opens in Compiler Explorer</span></div></div>
<div class="card"><div class="lbl">Assignment ${k}</div>${l.as.map(a=>`<div class="prob"><h5>${esc(a.t)}</h5><p>${esc(a.s)}</p></div>`).join('')}</div>
<div class="nav2">${k>1?`<button onclick="show('l${k-1}')">← Lab ${k-1}</button>`:'<span></span>'}${k<12?`<button onclick="show('l${k+1}')">Lab ${k+1} →</button>`:'<span></span>'}</div></section>`;});
M.innerHTML=h;
function show(id){document.querySelectorAll('.sec').forEach(s=>s.classList.toggle('on',s.id===id));
document.querySelectorAll('#menu a').forEach(a=>{const on=a.dataset.i===id;a.classList.toggle('on',on);if(on)a.scrollIntoView({block:'nearest',inline:'center'})});
window.scrollTo(0,0);try{history.replaceState(null,'','#'+id)}catch(e){}}
function tab(e){if(e.key==='Tab'){e.preventDefault();const t=e.target,s=t.selectionStart;t.value=t.value.slice(0,s)+'  '+t.value.slice(t.selectionEnd);t.selectionStart=t.selectionEnd=s+2}}
function run(k){const st={sessions:[{id:1,language:'c++',source:$('c'+k).value,compilers:[],executors:[{compiler:{id:'g132',libs:[],options:'-O2 -pthread -std=c++17'},stdin:$('i'+k).value,stdout:true,stderr:false,argumentsProvided:false,wrap:true}]}]};
const b=btoa(unescape(encodeURIComponent(JSON.stringify(st))));window.open('https://godbolt.org/clientstate/'+encodeURIComponent(b),'_blank')}
function reset(k){$('c'+k).value=LABS[k-1].code}
function cp(k){const t=$('c'+k);t.select();try{navigator.clipboard.writeText(t.value)}catch(e){document.execCommand('copy')}}
show((location.hash||'#home').slice(1).match(/^(home|l([1-9]|1[0-2]))$/)?location.hash.slice(1):'home');
</script></body></html>
